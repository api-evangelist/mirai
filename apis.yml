aid: mirai
name: Mirai
description: >-
  Mirai (trymirai.com) is an on-device AI infrastructure company building uzu, a
  high-performance, Rust-based inference engine that runs large language,
  text-to-speech, and classification models directly on consumer hardware —
  Apple Silicon, iOS, macOS, and beyond — with zero inference cost and full data
  privacy. The uzu SDK exposes a single high-level API across Python, Swift,
  TypeScript, and Rust, adding speculative decoding, structured output, and
  built-in performance metrics, plus an optional cloud path for hosted models.
  Founded by the co-creators of Reface and Prisma and backed by a $10M seed
  round led by Uncork Capital.
